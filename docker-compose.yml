# Sobe o sistema inteiro: banco, migrações e aplicação.
#   docker compose up -d --build
#
# Configuração fica em .env (veja .env.example). Sem .env, os padrões
# abaixo valem e servem para instalação local.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aprimore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aprimore}
      POSTGRES_DB: aprimoreosaber
      # pt_BR no ordenamento e busca textual
      LANG: pt_BR.UTF-8
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    ports:
      # Só no localhost: o banco não fica exposto à rede. Serve ao fluxo
      # de desenvolvimento do README; em produção, remova o mapeamento.
      - "127.0.0.1:${PORTA_BANCO:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aprimore -d aprimoreosaber"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    # Postgres usa memória compartilhada; o padrão de 64MB do Docker
    # aperta em consultas com ordenação.
    shm_size: 256mb

  web:
    build: .
    image: aprimore:latest
    environment:
      DATABASE_URL: postgres://aprimore:${POSTGRES_PASSWORD:-aprimore}@db:5432/aprimoreosaber
      NODE_ENV: production
      PROVEDOR_PAGAMENTO: ${PROVEDOR_PAGAMENTO:-simulado}
      WEBHOOK_SEGREDO: ${WEBHOOK_SEGREDO:-segredo-de-desenvolvimento}
      ASAAS_AMBIENTE: ${ASAAS_AMBIENTE:-sandbox}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      ALUNO_DEMO: ${ALUNO_DEMO:-}
      # Primeira subida importa o vade-mécum do Planalto (~3 min). 0 pula.
      IMPORTAR_LEIS: ${IMPORTAR_LEIS:-1}
      # §5.10 — domínio sob o qual os portais de professor vivem.
      # `jackson.<DOMINIO_BASE>` resolve o portal do Jackson; o domínio
      # nu é a plataforma. Em desenvolvimento, `jackson.localhost` funciona.
      DOMINIO_BASE: ${DOMINIO_BASE:-localhost}
      # §10 — os vídeos vivem no volume `midia`, nunca na imagem: assar
      # 100 GB de aula num `docker build` inviabilizaria todo deploy.
      VIDEO_SEGREDO: ${VIDEO_SEGREDO:-}
      VIDEO_RAIZ: /midia/video
      # §5.11 — o acervo da Biblioteca da empresa, ao lado do video e da
      # imagem no mesmo volume. Nunca na imagem Docker.
      DOCUMENTO_RAIZ: /midia/documento
      DOCUMENTO_MAX_BYTES: ${DOCUMENTO_MAX_BYTES:-52428800}
      # Vazio = o Node entrega os bytes. Com o perfil `vps`, o compose
      # sobe o nginx e esta variável passa a apontar a location interna.
      VIDEO_ACCEL_REDIRECT: ${VIDEO_ACCEL_REDIRECT:-}
    volumes:
      - midia:/midia
    ports:
      - "${PORTA_WEB:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/saude"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  # Só sobe com `docker compose --profile vps up -d`. Localmente o Node dá
  # conta de entregar o vídeo sozinho, e um proxy a mais só atrapalharia o
  # `next dev`. Na VPS ele é obrigatório: ver nginx/aprimoreosaber.conf.
  nginx:
    profiles: ["vps"]
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/aprimoreosaber.conf:/etc/nginx/conf.d/default.conf:ro
      # Somente leitura: o nginx entrega aula, nunca grava.
      - midia:/midia:ro
    # Quem ouve a rua é o Caddy; o nginx só atende dentro da rede do Compose.
    expose:
      - "80"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  # HTTPS de tudo — inclusive do domínio próprio de cada professor (§5.10,
  # Fase 2), com certificado emitido sob demanda. Ver caddy/Caddyfile.
  caddy:
    profiles: ["vps"]
    image: caddy:2-alpine
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-}
      # Modo IP (caddy/Caddyfile.ip), enquanto não há domínio registrado.
      IP_PUBLICO: ${IP_PUBLICO:-}
      PORTA_HTTPS: ${PORTA_HTTPS:-443}
      ACESSO_USUARIO: ${ACESSO_USUARIO:-aprimore}
      ACESSO_SENHA_HASH: ${ACESSO_SENHA_HASH:-}
    volumes:
      # caddy/Caddyfile = domínio com HTTPS automático; caddy/Caddyfile.ip =
      # só o IP, com certificado interno e senha na porta. Ver .env.vps.example.
      - ${CADDYFILE:-./caddy/Caddyfile}:/etc/caddy/Caddyfile:ro
      # Certificados e chaves: perder este volume é reemitir tudo.
      - caddy-dados:/data
      - caddy-config:/config
    ports:
      - "${PORTA_HTTP:-80}:80"
      - "${PORTA_HTTPS:-443}:443"
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  caddy-dados:
  caddy-config:
  dados-postgres:
  # Mídia das aulas. Volume nomeado, e não bind mount, para não depender do
  # layout de pastas do host — mas com um aviso que vale repetir: este
  # volume NÃO entra no backup do Postgres. Ele precisa de rotina própria.
  midia:
