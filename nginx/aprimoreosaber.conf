# nginx da VPS — só entra em cena com o perfil `vps`:
#
#   docker compose --profile vps up -d
#
# Sem o perfil, o Compose sobe como sempre e o Node entrega tudo, inclusive
# o vídeo. É o modo de desenvolvimento, e é o que se valida na máquina.
#
# O que este arquivo resolve: o Node decide QUEM assiste, o nginx TRANSPORTA
# os bytes. Sem essa divisão, centenas de megabytes por aula atravessariam o
# event loop do Node, e uma turma assistindo à noite deixaria o site inteiro
# lento — inclusive para quem só está fazendo exercício.

# ---------------------------------------------------------------
# Quem está do outro lado
# ---------------------------------------------------------------
# Na rua só o Caddy escuta; o nginx recebe dele. Sem isto, todo visitante
# teria o IP do container do Caddy — e o limite de tentativas abaixo
# bloquearia o site inteiro de uma vez. Só redes privadas (a do Compose)
# podem informar o IP original.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header   X-Forwarded-For;
real_ip_recursive on;

# O Caddy termina o HTTPS e avisa em X-Forwarded-Proto. Repassar $scheme
# aqui diria "http" à aplicação mesmo com o navegador em https.
map $http_x_forwarded_proto $proto_externo {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

# ---------------------------------------------------------------
# Força bruta no login
# ---------------------------------------------------------------
# O login é Server Action: um POST na própria página. Só o POST conta —
# abrir a tela de entrar à vontade não é ataque. 10 tentativas por minuto
# por IP, com folga de 10 em rajada; acima disso, 429.
map $request_method $chave_login {
  POST    $binary_remote_addr;
  default "";
}
limit_req_zone $chave_login zone=login:10m rate=10r/m;
limit_req_status 429;

upstream aplicacao {
  server web:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name _;

  # O upload de aula é o maior corpo que passa por aqui.
  client_max_body_size 2g;

  # ---------------------------------------------------------------
  # Mídia das aulas
  # ---------------------------------------------------------------
  # `internal` é a linha mais importante do arquivo: esta location NÃO
  # responde a requisição vinda da rua. Só o próprio nginx chega nela, e
  # só quando a aplicação devolve o cabeçalho X-Accel-Redirect — isto é,
  # depois de conferir a assinatura em /api/video (lib/video.ts).
  #
  # Tirar o `internal` publicaria o acervo inteiro sem licença.
  location /midia-interna/ {
    internal;
    alias /midia/video/;

    # sendfile: o arquivo vai do disco para o socket sem passar pela
    # memória do processo. É o motivo de o nginx estar aqui.
    sendfile on;
    tcp_nopush on;
    aio threads;

    # O nginx recalcula a faixa de bytes sozinho; a aplicação não precisa
    # mandar Content-Range. É o que faz a barra de progresso funcionar.
    max_ranges 1;

    # O endereço é assinado e pessoal — nenhum cache compartilhado guarda.
    add_header Cache-Control "private, max-age=3600" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # ---------------------------------------------------------------
  # Aplicação
  # ---------------------------------------------------------------
  location / {
    proxy_pass http://aplicacao;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proto_externo;
    proxy_set_header Connection        "";

    # O X-Accel-Redirect é processado aqui sem precisar de diretiva: o
    # nginx age sobre ele sempre que a aplicação o devolve. O que ele
    # NÃO faz é aceitá-lo vindo da rua — a location de mídia é `internal`.
    proxy_connect_timeout 5s;
    proxy_read_timeout   60s;
  }

  # ---------------------------------------------------------------
  # Telas que recebem senha (o portal do professor e o da empresa usam
  # os mesmos caminhos, cada um no seu Host)
  # ---------------------------------------------------------------
  location ~ ^/(entrar|cadastrar|convite|conta)(/|$) {
    limit_req zone=login burst=10 nodelay;
    proxy_pass http://aplicacao;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proto_externo;
    proxy_set_header Connection        "";
    proxy_connect_timeout 5s;
    proxy_read_timeout   60s;
  }

  # ---------------------------------------------------------------
  # Upload de aula pelo painel do professor (§5.10)
  # ---------------------------------------------------------------
  # O arquivo flui do cliente para o Node sem parar em disco temporário
  # do nginx (request_buffering off), e a barra de progresso no navegador
  # passa a refletir o envio de verdade. Timeouts largos: um vídeo de
  # 2 GB numa conexão doméstica leva minutos.
  location /api/upload {
    client_max_body_size 2g;
    proxy_request_buffering off;
    proxy_pass http://aplicacao;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proto_externo;
    proxy_set_header Connection        "";
    proxy_connect_timeout 5s;
    proxy_send_timeout    1800s;
    proxy_read_timeout    1800s;
  }

  # ---------------------------------------------------------------
  # TLS
  # ---------------------------------------------------------------
  # Não é aqui: quem faz o HTTPS é o Caddy, na frente deste nginx
  # (caddy/Caddyfile com domínio, caddy/Caddyfile.ip enquanto só há IP).
  # Ver docs/implantacao-vps.md.
}
